<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Better Day</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;touch-action:none;color:#fff;}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;transition:opacity 0.5s;}
  .overlay.hidden{opacity:0;pointer-events:none;}
  #startScreen{background:rgba(0,0,0,0.85);}
  #startScreen h1{font-size:32px;font-weight:700;margin-bottom:8px;background:linear-gradient(135deg,#64c8ff,#f0c040);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  #startScreen .subtitle{font-size:15px;color:rgba(255,255,255,0.6);margin-bottom:30px;text-align:center;max-width:280px;line-height:1.5;}
  #startScreen .play-btn{background:linear-gradient(135deg,#2196F3,#64c8ff);border:none;color:#fff;padding:14px 40px;border-radius:30px;font-size:17px;font-weight:600;cursor:pointer;}
  .mode-buttons{display:flex;gap:12px;margin-bottom:10px;}
  .mode-btn{background:rgba(255,255,255,0.08);border:2px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.7);padding:16px 20px;border-radius:16px;font-size:14px;font-weight:600;cursor:pointer;text-align:center;min-width:120px;transition:all 0.2s;}
  .mode-btn .mode-icon{font-size:28px;margin-bottom:6px;}
  .mode-btn .mode-label{font-size:13px;opacity:0.6;font-weight:400;}
  .mode-btn.selected{border-color:rgba(100,200,255,0.6);background:rgba(100,200,255,0.15);color:#fff;}
  .mode-btn:active{transform:scale(0.97);}
  #completeScreen{background:rgba(0,0,0,0.85);}
  #completeScreen h2{font-size:28px;margin-bottom:6px;color:#64c8ff;}
  #completeScreen .score-display{font-size:48px;font-weight:700;margin:16px 0;background:linear-gradient(135deg,#f0c040,#ff8a50);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  #completeScreen .stats{font-size:14px;color:rgba(255,255,255,0.6);margin-bottom:24px;text-align:center;line-height:1.8;}
  #completeScreen .play-btn{background:linear-gradient(135deg,#4CAF50,#66BB6A);border:none;color:#fff;padding:14px 40px;border-radius:30px;font-size:17px;font-weight:600;cursor:pointer;}
  .hud{position:absolute;top:0;left:0;right:0;z-index:10;pointer-events:none;}
  .hud-top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 0;}
  .hud-score{font-size:20px;font-weight:700;color:#64c8ff;}
  .hud-right{display:flex;align-items:center;gap:10px;}
  .hud-timer{font-size:16px;color:rgba(255,255,255,0.7);font-variant-numeric:tabular-nums;}
  .settings-btn{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);color:rgba(255,255,255,0.7);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;}
  .settings-btn:active{background:rgba(255,255,255,0.3);}
  .hud-progress{margin:10px 16px 0;height:3px;background:rgba(255,255,255,0.15);border-radius:2px;}
  .hud-progress-bar{height:100%;background:linear-gradient(90deg,#64c8ff,#4CAF50);border-radius:2px;transition:width 0.4s;width:0%;}

  .settings-panel{position:absolute;top:50px;right:10px;background:rgba(0,0,0,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.15);border-radius:16px;padding:14px;z-index:20;display:none;pointer-events:auto;min-width:200px;}
  .settings-panel.visible{display:flex;flex-direction:column;gap:10px;}
  .settings-panel .s-row{display:flex;align-items:center;gap:8px;}
  .settings-panel .s-label{color:rgba(255,255,255,0.6);font-size:12px;min-width:50px;}
  .settings-panel input[type=range]{flex:1;accent-color:#64c8ff;height:20px;}
  .settings-panel .s-value{color:rgba(255,255,255,0.8);font-size:12px;min-width:50px;text-align:right;}
  .s-btn{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.7);padding:6px 12px;border-radius:12px;font-size:11px;cursor:pointer;text-align:center;}
  .s-btn:active{background:rgba(255,255,255,0.25);}
  .s-btn.active{background:rgba(100,200,255,0.2);border-color:rgba(100,200,255,0.4);color:#64c8ff;}
  .carry-bar{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(100,200,255,0.3);padding:8px 16px;border-radius:20px;z-index:10;display:none;text-align:center;pointer-events:auto;}
  .carry-bar.visible{display:flex;align-items:center;gap:10px;}
  .carry-bar .carry-text{font-size:12px;color:rgba(255,255,255,0.7);}
  .carry-bar .cancel-btn{background:rgba(255,100,100,0.3);border:1px solid rgba(255,100,100,0.4);color:#fff;padding:6px 16px;border-radius:16px;font-size:12px;cursor:pointer;pointer-events:auto;}
  .preview-hex{position:absolute;bottom:16px;left:12px;z-index:12;display:none;pointer-events:none;}
  .preview-hex.visible{display:block;}
  .hint-btn{position:absolute;bottom:24px;right:20px;width:52px;height:52px;border-radius:50%;background:rgba(100,200,255,0.2);border:2px solid rgba(100,200,255,0.5);color:#64c8ff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:12;pointer-events:auto;transition:all 0.3s;}
  .hint-btn.cooldown{opacity:0.3;border-color:rgba(255,255,255,0.2);color:rgba(255,255,255,0.3);}
  .hint-btn.hidden{display:none;}
  .info-bar{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.4);font-size:11px;z-index:10;pointer-events:none;text-align:center;}
  input[type=file]{display:none;}
  .flash{position:absolute;inset:0;pointer-events:none;z-index:15;opacity:0;transition:opacity 0.3s;}
  .flash.correct{background:rgba(76,175,80,0.15);}
  .flash.wrong{background:rgba(244,67,54,0.15);}
  .flash.show{opacity:1;}
</style>
</head>
<body>
<div class="overlay" id="startScreen"><h1>Better Day</h1><div class="subtitle">Collect hidden tiles and piece together a better world.<br>Long-press to collect · Swipe to explore · Long-press to place.</div><div class="mode-buttons"><button class="mode-btn selected" id="modeHexBtn" onclick="selectMode('hex')"><div class="mode-icon">△</div>Mosaic<div class="mode-label">Abstract triangles</div></button><button class="mode-btn" id="modeImgBtn" onclick="selectMode('image')"><div class="mode-icon">🌄</div>Image<div class="mode-label">Two panoramas</div></button></div><button class="play-btn" id="startBtn">Play</button></div>
<div class="overlay hidden" id="completeScreen"><h2>A Better Day!</h2><div class="score-display" id="finalScore">0</div><div class="stats" id="finalStats"></div><button class="play-btn" id="replayBtn">Play Again</button></div>
<div class="hud" id="hud" style="display:none;"><div class="hud-top"><div class="hud-score" id="scoreDisplay">0</div><div class="hud-right"><div class="settings-btn" id="settingsBtn">⚙</div><div class="hud-timer" id="timerDisplay">0:00</div></div></div><div class="hud-progress"><div class="hud-progress-bar" id="progressBar"></div></div></div>
<div class="carry-bar" id="carryBar"><div class="carry-text">Find where this belongs</div><button class="cancel-btn" id="cancelBtn">Cancel</button></div>
<canvas class="preview-hex" id="previewHex" width="210" height="210"></canvas>
<div class="hint-btn hidden" id="hintBtn">?</div>

<!-- Settings panel (hidden by default) -->
<div class="settings-panel" id="settingsPanel">
  <div class="s-row"><span class="s-label">Tiles</span><input type="range" id="hexSlider" min="0" max="3" value="1" step="1"><span class="s-value" id="hexCount">40</span></div>
  <div class="s-row" id="mosaicRow" style="display:none;"><span class="s-label">Detail</span><input type="range" id="mosaicSlider" min="2" max="200" value="98" step="1"><span class="s-value" id="mosaicVal">98</span></div>
  <div class="s-row" style="gap:6px;flex-wrap:wrap;">
    <button class="s-btn" id="uploadBadBtn" style="border-color:rgba(255,100,100,0.3)">Bad Day ▲</button>
    <button class="s-btn" id="uploadGoodBtn" style="border-color:rgba(100,255,120,0.3)">Better Day ▲</button>
  </div>
  <div class="s-row" style="gap:6px;flex-wrap:wrap;">
    <button class="s-btn" id="edgeBtn">Edges</button>
    <button class="s-btn active" id="modeBtn">Easy</button>
    <button class="s-btn" id="viewBtn">Outside</button>
  </div>
</div>
<input type="file" id="fileBad" accept="image/*"><input type="file" id="fileGood" accept="image/*">
<div class="flash correct" id="flashCorrect"></div><div class="flash wrong" id="flashWrong"></div>
<div class="info-bar" id="infoBar"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

// ═══════════════════════════════════════════
// 1. THREE.JS
// ═══════════════════════════════════════════
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1100);
camera.position.set(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

// ═══════════════════════════════════════════
// 2. GEODESIC
// ═══════════════════════════════════════════
function createIco(){const t=(1+Math.sqrt(5))/2;const r=[[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]];const v=r.map(p=>{const l=Math.sqrt(p[0]**2+p[1]**2+p[2]**2);return[p[0]/l,p[1]/l,p[2]/l];});const f=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];return{verts:v,faces:f};}

function subdivide(verts,faces,n){let cv=verts.slice(),cf=faces.slice();for(let it=0;it<n;it++){const cache={},nf=[];function mid(a,b){const k=Math.min(a,b)+':'+Math.max(a,b);if(cache[k]!==undefined)return cache[k];const va=cv[a],vb=cv[b];let x=(va[0]+vb[0])/2,y=(va[1]+vb[1])/2,z=(va[2]+vb[2])/2;const l=Math.sqrt(x*x+y*y+z*z);x/=l;y/=l;z/=l;const i=cv.length;cv.push([x,y,z]);cache[k]=i;return i;}for(const[a,b,c]of cf){const ab=mid(a,b),bc=mid(b,c),ca=mid(c,a);nf.push([a,ab,ca],[b,bc,ab],[c,ca,bc],[ab,bc,ca]);}cf=nf;}return{verts:cv,faces:cf};}

function computeDual(verts,faces){
  const vf=Array.from({length:verts.length},()=>[]);
  for(let fi=0;fi<faces.length;fi++)for(const vi of faces[fi])vf[vi].push(fi);
  const cen=faces.map(([a,b,c])=>{const va=verts[a],vb=verts[b],vc=verts[c];let x=(va[0]+vb[0]+vc[0])/3,y=(va[1]+vb[1]+vc[1])/3,z=(va[2]+vb[2]+vc[2])/3;const l=Math.sqrt(x*x+y*y+z*z);return[x/l,y/l,z/l];});
  const df=[],v2d=new Array(verts.length).fill(-1);
  for(let vi=0;vi<verts.length;vi++){
    const adj=vf[vi];if(adj.length<3)continue;
    const v=verts[vi],pts=adj.map(fi=>cen[fi]);
    const nx=v[0],ny=v[1],nz=v[2];
    let tx,ty,tz;if(Math.abs(nx)<.9){tx=0;ty=-nz;tz=ny;}else{tx=-nz;ty=0;tz=nx;}
    const tl=Math.sqrt(tx*tx+ty*ty+tz*tz);tx/=tl;ty/=tl;tz/=tl;
    const bx=ny*tz-nz*ty,by=nz*tx-nx*tz,bz=nx*ty-ny*tx;
    const ang=pts.map((p,i)=>{const dx=p[0]-nx*.999,dy=p[1]-ny*.999,dz=p[2]-nz*.999;return{a:Math.atan2(dx*bx+dy*by+dz*bz,dx*tx+dy*ty+dz*tz),i};});
    ang.sort((a,b)=>a.a-b.a);v2d[vi]=df.length;
    df.push({center:v,vertices:ang.map(a=>pts[a.i]),sides:adj.length});
  }
  const adja=Array.from({length:df.length},()=>new Set());
  for(const[a,b,c]of faces){const da=v2d[a],db=v2d[b],dc=v2d[c];if(da>=0&&db>=0){adja[da].add(db);adja[db].add(da);}if(db>=0&&dc>=0){adja[db].add(dc);adja[dc].add(db);}if(da>=0&&dc>=0){adja[da].add(dc);adja[dc].add(da);}}
  return{dualFaces:df,adjacency:adja.map(s=>[...s])};
}

function s2uv(x,y,z){return[(Math.atan2(z,x)/(2*Math.PI)+.5),Math.asin(Math.max(-1,Math.min(1,y)))/Math.PI+.5];}

  const img=new Image();

// 6c. MOSAIC TEXTURE GENERATOR
// Takes the good-day image and renders it as
// a grid of solid-colour triangles
// ═══════════════════════════════════════════
function generateMosaicTex(sourceTexture,density){
  // Get the source image from the texture
  const srcImg=sourceTexture.image;
  if(!srcImg)return null;

  // Sample canvas: draw source image to read pixel colours
  const sC=document.createElement('canvas');
  sC.width=srcImg.naturalWidth||srcImg.width;
  sC.height=srcImg.naturalHeight||srcImg.height;
  const sCtx=sC.getContext('2d');
  sCtx.drawImage(srcImg,0,0,sC.width,sC.height);

  // Output canvas: same dimensions as source
  const w=sC.width,h=sC.height;
  const oC=document.createElement('canvas');
  oC.width=w;oC.height=h;
  const ctx=oC.getContext('2d');

  // Fill with dark background
  ctx.fillStyle='#0a0a0a';
  ctx.fillRect(0,0,w,h);

  // Triangle geometry (equilateral triangles)
  // density = number of triangles across the width
  const triBase=w/density;
  const triH=triBase*Math.sqrt(3)/2;
  const rows=Math.ceil(h/triH)+1;

  for(let row=0;row<rows;row++){
    const y=row*triH;
    // Each row has up-pointing and down-pointing triangles
    const cols=density+2;
    for(let col=-1;col<cols;col++){
      // Up-pointing triangle: base at bottom
      const ux0=col*triBase;
      const ux1=(col+1)*triBase;
      const uxm=(col+0.5)*triBase;
      const uy0=y+triH; // bottom
      const uy1=y;       // top

      // Sample at centroid of up-pointing triangle
      const ucx=(ux0+ux1+uxm)/3;
      const ucy=(uy0+uy0+uy1)/3;
      if(ucx>=0&&ucx<w&&ucy>=0&&ucy<h){
        const px=sCtx.getImageData(Math.floor(ucx),Math.floor(ucy),1,1).data;
        const darken=0.55;
        ctx.fillStyle=`rgb(${Math.floor(px[0]*darken)},${Math.floor(px[1]*darken)},${Math.floor(px[2]*darken)})`;
        ctx.beginPath();
        ctx.moveTo(ux0,uy0);ctx.lineTo(ux1,uy0);ctx.lineTo(uxm,uy1);
        ctx.closePath();ctx.fill();
      }

      // Down-pointing triangle: base at top
      const dx0=col*triBase+triBase/2;
      const dx1=(col+1)*triBase+triBase/2;
      const dxm=(col+1)*triBase;
      const dy0=y;        // top
      const dy1=y+triH;   // bottom

      const dcx=(dx0+dx1+dxm)/3;
      const dcy=(dy0+dy0+dy1)/3;
      if(dcx>=0&&dcx<w&&dcy>=0&&dcy<h){
        const px=sCtx.getImageData(Math.floor(dcx),Math.floor(dcy),1,1).data;
        const darken=0.55;
        ctx.fillStyle=`rgb(${Math.floor(px[0]*darken)},${Math.floor(px[1]*darken)},${Math.floor(px[2]*darken)})`;
        ctx.beginPath();
        ctx.moveTo(dx0,dy0);ctx.lineTo(dx1,dy0);ctx.lineTo(dxm,dy1);
        ctx.closePath();ctx.fill();
      }
    }
  }

  const t=new THREE.CanvasTexture(oC);
  t.wrapS=THREE.RepeatWrapping;
  t.wrapT=THREE.ClampToEdgeWrapping;
  t.needsUpdate=true;
  return t;
}

// 7. BUILD SPHERE
// ═══════════════════════════════════════════
function build(){
  if(geoGrp){geoGrp.traverse(c=>{if(c.geometry)c.geometry.dispose();if(c.material)c.material.dispose();});scene.remove(geoGrp);}
  if(edgeGrp){edgeGrp.traverse(c=>{if(c.geometry)c.geometry.dispose();if(c.material)c.material.dispose();});scene.remove(edgeGrp);}
  if(hlGrp){hlGrp.traverse(c=>{if(c.geometry)c.geometry.dispose();if(c.material)c.material.dispose();});scene.remove(hlGrp);}
  geoGrp=new THREE.Group();edgeGrp=new THREE.Group();hlGrp=new THREE.Group();fMeshes=[];fD=[];

  const ic=createIco(),s=subdivide(ic.verts,ic.faces,curSub);
  const{dualFaces:df,adjacency:ad}=computeDual(s.verts,s.faces);
  adj=ad;total=df.length;

  if(!badTex)badTex=mkBadFallback();if(!goodTex)goodTex=mkGoodFallback();
  if(!poleInTex)poleInTex=mkPoleTex('IN');
  if(!poleOutTex)poleOutTex=mkPoleTex('OUT');
  badTex.wrapS=THREE.RepeatWrapping;badTex.wrapT=THREE.ClampToEdgeWrapping;
  goodTex.wrapS=THREE.RepeatWrapping;goodTex.wrapT=THREE.ClampToEdgeWrapping;

  // Find pole tiles (highest and lowest Y center)
  let topY=-Infinity,botY=Infinity;poleTop=-1;poleBot=-1;
  for(let i=0;i<df.length;i++){
    const y=df[i].center[1];
    if(y>topY){topY=y;poleTop=i;}
    if(y<botY){botY=y;poleBot=i;}
  }

  const aE=[],aPE=[];
  // Face subdivision: handle curSub=0 safely
  const fS=curSub===0?3:Math.max(2,Math.ceil(8/curSub));

  for(let fi=0;fi<df.length;fi++){
    const face=df[fi],vt=face.vertices,n=vt.length;
    const pos=[],uvs=[];
    for(let i=0;i<n;i++){
      const v0=face.center,v1=vt[i],v2=vt[(i+1)%n];
      for(let row=0;row<fS;row++){
        const r0=row/fS,r1=(row+1)/fS;
        for(let col=0;col<=row;col++){
          const c0=row>0?col/row:0,c1=col/(row+1),c2=(col+1)/(row+1);
          function lp(t,s){return[v0[0]*(1-t)+(v1[0]*s+v2[0]*(1-s))*t,v0[1]*(1-t)+(v1[1]*s+v2[1]*(1-s))*t,v0[2]*(1-t)+(v1[2]*s+v2[2]*(1-s))*t];}
          const a0=lp(r0,c0),b0=lp(r1,c1),b1=lp(r1,c2);
          pos.push(-a0[0]*RAD,a0[1]*RAD,a0[2]*RAD,-b0[0]*RAD,b0[1]*RAD,b0[2]*RAD,-b1[0]*RAD,b1[1]*RAD,b1[2]*RAD);
          const ua=s2uv(-a0[0],a0[1],a0[2]),ub=s2uv(-b0[0],b0[1],b0[2]),uc=s2uv(-b1[0],b1[1],b1[2]);
          if(Math.max(ua[0],ub[0],uc[0])-Math.min(ua[0],ub[0],uc[0])>.5){if(ua[0]<.5)ua[0]+=1;if(ub[0]<.5)ub[0]+=1;if(uc[0]<.5)uc[0]+=1;}
          uvs.push(ua[0],ua[1],ub[0],ub[1],uc[0],uc[1]);
          if(col<row){
            const cb=(col+1)/row,a1=lp(r0,cb);
            pos.push(-a0[0]*RAD,a0[1]*RAD,a0[2]*RAD,-b1[0]*RAD,b1[1]*RAD,b1[2]*RAD,-a1[0]*RAD,a1[1]*RAD,a1[2]*RAD);
            const ud=s2uv(-a1[0],a1[1],a1[2]),ua2=[ua[0],ua[1]],uc2=[uc[0],uc[1]];
            if(Math.max(ua2[0],uc2[0],ud[0])-Math.min(ua2[0],uc2[0],ud[0])>.5){if(ua2[0]<.5)ua2[0]+=1;if(uc2[0]<.5)uc2[0]+=1;if(ud[0]<.5)ud[0]+=1;}
            uvs.push(ua2[0],ua2[1],uc2[0],uc2[1],ud[0],ud[1]);
          }
        }
      }
    }
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    geo.setAttribute('uv',new THREE.Float32BufferAttribute(new Float32Array(uvs),2));

    // Pole tiles get black texture with IN/OUT label
    const activeBadTex=(gameMode==='hex'&&mosaicTex)?mosaicTex:badTex;
    let tileTex=activeBadTex;
    const isPole=(fi===poleTop||fi===poleBot);
    if(isPole)tileTex=fi===poleBot?poleInTex:poleOutTex;

    const mat=new THREE.MeshBasicMaterial({map:tileTex,side:THREE.BackSide});
    const mesh=new THREE.Mesh(geo,mat);mesh.userData.fi=fi;
    geoGrp.add(mesh);fMeshes.push(mesh);

    fD.push({center:face.center,verts:vt,sides:n,mesh,uvs:new Float32Array(uvs),state:isPole?'pole':'hidden',isPole});

    // Grid edges
    const eA=n===5?aPE:aE;
    for(let i=0;i<n;i++){const e1=vt[i],e2=vt[(i+1)%n];
      eA.push(-e1[0]*RAD*.998,e1[1]*RAD*.998,e1[2]*RAD*.998,-e2[0]*RAD*.998,e2[1]*RAD*.998,e2[2]*RAD*.998);}
  }
  scene.add(geoGrp);

  // Grid lines — triple drawn for boldness
  function addEdges(arr,col,op,scale){
    if(!arr.length)return;
    const p=new Float32Array(arr);
    if(scale!==1)for(let i=0;i<p.length;i++)p[i]*=scale;
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
    edgeGrp.add(new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:col,transparent:true,opacity:op})));

  addEdges(aPE,pentCol,.9,1);addEdges(aPE,pentCol,.75,497/498);addEdges(aPE,pentCol,.6,496/498);addEdges(aPE,pentCol,.5,495/498);addEdges(aPE,pentCol,.4,494/498);

// Apply correct texture + UVs based on current view mode and tile state
function applyTile(i){
  const f=fD[i];if(f.isPole)return;
  if(gameMode==='hex'){
    if(viewInside){
      // Inside: mosaic for untransformed, good-day for transformed
      f.mesh.material.map=f.state==='transformed'?goodTex:mosaicTex;
      f.mesh.geometry.setAttribute('uv',new THREE.Float32BufferAttribute(f.uvs.slice(),2));
    } else {
      // Outside: always good-day texture
      f.mesh.material.map=goodTex;
      if(f.state==='transformed'){
        // Already resolved — show correct content
        f.mesh.geometry.setAttribute('uv',new THREE.Float32BufferAttribute(f.uvs.slice(),2));
      } else if(f.scrambledUvs){
        // Scrambled — show content from wrong position
        f.mesh.geometry.setAttribute('uv',new THREE.Float32BufferAttribute(f.scrambledUvs.slice(),2));
      } else {
        f.mesh.geometry.setAttribute('uv',new THREE.Float32BufferAttribute(f.uvs.slice(),2));
      }
    }
  } else {
    // Image mode: original behaviour
    const activeBadTex=badTex;
    f.mesh.material.map=f.state==='transformed'?goodTex:activeBadTex;
    f.mesh.geometry.setAttribute('uv',new THREE.Float32BufferAttribute(f.uvs.slice(),2));
  }
  f.mesh.material.color.setRGB(1,1,1);
  f.mesh.material.needsUpdate=true;
}

// Legacy wrapper for image mode (keeps backlog code working)

// Switch all tiles to inside view

// Compute scrambled UVs for a tile based on its sMap target
function computeScrambledUvs(i){
  if(fD[i].isPole||sMap[i]<0||sMap[i]===i){fD[i].scrambledUvs=null;return;}
  const srcC=fD[i].center;
  const tgtC=fD[sMap[i]].center;
  const srcUV=s2uv(-srcC[0],srcC[1],srcC[2]);
  const tgtUV=s2uv(-tgtC[0],tgtC[1],tgtC[2]);
  let du=tgtUV[0]-srcUV[0];
  const dv=tgtUV[1]-srcUV[1];
  if(du>0.5)du-=1;if(du<-0.5)du+=1;
  const orig=fD[i].uvs;
  const scr=new Float32Array(orig.length);
  for(let j=0;j<orig.length;j+=2){scr[j]=orig[j]+du;scr[j+1]=orig[j+1]+dv;}
  fD[i].scrambledUvs=scr;
}

// Find which tile on the outside holds the content for position p
function findOutsideTile(p){
  for(let i=0;i<total;i++){
    if(!fD[i].isPole&&fD[i].state!=='transformed'&&sMap[i]===p)return i;
  }
  return -1;
}

// 10. RENDER-TO-TEXTURE PREVIEW
// Camera points at TARGET tile to show what
// the good-day content looks like there
// ═══════════════════════════════════════════
function renderPreview(targetIdx,size){
  const rt=new THREE.WebGLRenderTarget(size,size);
  const f=fD[targetIdx];

  for(let i=0;i<fMeshes.length;i++){
    if(i===targetIdx){
      fMeshes[i].visible=true;fMeshes[i].material.map=goodTex;
      fMeshes[i].material.side=THREE.BackSide; // always render preview from inside
      fMeshes[i].material.color.setRGB(1,1,1);fMeshes[i].material.needsUpdate=true;
      fMeshes[i].geometry.setAttribute('uv',new THREE.Float32BufferAttribute(fD[i].uvs.slice(),2));
    }
    else fMeshes[i].visible=false;
  }
  const wasEdge=edgeGrp.visible,wasHL=hlGrp.visible;
  edgeGrp.visible=false;hlGrp.visible=false;

  const tileAngle=Math.sqrt(4*Math.PI/total)*180/Math.PI;
  const camFOV=tileAngle*1.8;

  const cam2=new THREE.PerspectiveCamera(camFOV,1,.1,1100);
  cam2.position.set(0,0,0);
  cam2.lookAt(-f.center[0]*RAD,f.center[1]*RAD,f.center[2]*RAD);
  cam2.updateMatrixWorld();

  // Project tile vertices through preview camera to get 2D positions
  const projVerts=f.verts.map(v=>{
    const v3=new THREE.Vector3(-v[0]*RAD,v[1]*RAD,v[2]*RAD);
    v3.project(cam2);
    return{x:(v3.x+1)/2*size, y:(-v3.y+1)/2*size};
  });

  renderer.setRenderTarget(rt);renderer.setClearColor(0x000000,0);renderer.clear();
  renderer.render(scene,cam2);renderer.setRenderTarget(null);

  const px=new Uint8Array(size*size*4);
  renderer.readRenderTargetPixels(rt,0,0,size,size,px);

  const cv=document.createElement('canvas');cv.width=size;cv.height=size;
  const ctx=cv.getContext('2d');
  const id=ctx.createImageData(size,size);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const si=((size-1-y)*size+x)*4,di=(y*size+x)*4;
    id.data[di]=px[si];id.data[di+1]=px[si+1];id.data[di+2]=px[si+2];id.data[di+3]=255;
  }
  ctx.putImageData(id,0,0);

  const curSide=viewInside?THREE.BackSide:THREE.FrontSide;
  for(let i=0;i<fMeshes.length;i++){
    fMeshes[i].visible=true;
    fMeshes[i].material.side=curSide;
    const fd=fD[i];
    if(fd.isPole){fMeshes[i].material.map=i===poleBot?poleInTex:poleOutTex;}
    else applyTile(i);
    fMeshes[i].material.needsUpdate=true;
  }
  edgeGrp.visible=wasEdge;hlGrp.visible=wasHL;
  rt.dispose();
  return{canvas:cv, verts:projVerts};
}

function hexPath(ctx,cx,cy,r,sides){ctx.beginPath();for(let i=0;i<sides;i++){const a=Math.PI*2/sides*i-Math.PI/2;ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));}ctx.closePath();}

function showThumb(targetIdx){
  if(!easy)return;
  const SZ=210;
  const renderSize=420;
  const result=renderPreview(targetIdx,renderSize);
  const raw=result.canvas;
  const projVerts=result.verts;
  const sides=fD[targetIdx].sides||6;
  const el=document.getElementById('previewHex');
  el.width=SZ;el.height=SZ;
  const ctx=el.getContext('2d');
  ctx.clearRect(0,0,SZ,SZ);

  // Scale projected vertices from render size to display size
  const scale=SZ/renderSize;
  const sv=projVerts.map(v=>({x:v.x*scale, y:v.y*scale}));

  // Clip to actual tile shape using projected vertices
  ctx.save();

  // In mosaic mode, flip horizontally so preview matches outside view
  if(gameMode==='hex'){
    ctx.translate(SZ,0);
    ctx.scale(-1,1);
  }

  ctx.beginPath();
  ctx.moveTo(sv[0].x, sv[0].y);
  for(let i=1;i<sv.length;i++) ctx.lineTo(sv[i].x, sv[i].y);
  ctx.closePath();
  ctx.clip();
  ctx.drawImage(raw,0,0,renderSize,renderSize,0,0,SZ,SZ);
  ctx.restore();

  // Orange border following actual tile shape (mirrored coords for mosaic)
  ctx.strokeStyle='#e67e22';ctx.lineWidth=4;
  ctx.beginPath();
  if(gameMode==='hex'){
    ctx.moveTo(SZ-sv[0].x, sv[0].y);
    for(let i=1;i<sv.length;i++) ctx.lineTo(SZ-sv[i].x, sv[i].y);
  } else {
    ctx.moveTo(sv[0].x, sv[0].y);
    for(let i=1;i<sv.length;i++) ctx.lineTo(sv[i].x, sv[i].y);
  }
  ctx.closePath();
  ctx.stroke();

  el.classList.add('visible');
}

function hideThumb(){document.getElementById('previewHex').classList.remove('visible');}

// ═══════════════════════════════════════════
// 11. GAME LOGIC
// ═══════════════════════════════════════════
function startGame(){
  // Generate mosaic texture in hex mode
  if(gameMode==='hex'&&goodTex){
    if(mosaicTex)mosaicTex.dispose();
    mosaicTex=generateMosaicTex(goodTex,mosaicDensity);
  }

  build();

  // Show/hide controls based on mode
  document.getElementById('mosaicRow').style.display=gameMode==='hex'?'flex':'none';
  document.getElementById('uploadBadBtn').style.display=gameMode==='hex'?'none':'';

  // Build scramble map only for playable (non-pole) tiles
  const playIdx=[];
  for(let i=0;i<total;i++)if(!fD[i].isPole)playIdx.push(i);
  playable=playIdx.length;

  // Generate derangement for playable tiles
  // sMap[i] = j means "outside position i holds the good-day content for position j"
  const d=derange(playable);
  sMap=new Array(total).fill(-1);
  for(let i=0;i<playable;i++)sMap[playIdx[i]]=playIdx[d[i]];

  // Compute scrambled UVs for outside view
  for(let i=0;i<total;i++)computeScrambledUvs(i);

  // Set initial tile states
  for(let i=0;i<total;i++)if(!fD[i].isPole)setFS(i,'hidden');

  // Mosaic mode always starts inside
  if(gameMode==='hex')switchToInside(); else {
    // Image mode: ensure correct view
    viewInside=true;
    for(let i=0;i<fMeshes.length;i++){fMeshes[i].material.side=THREE.BackSide;fMeshes[i].material.needsUpdate=true;}
  }

  done=0;score=0;moves=0;carryF=-1;carryT=-1;
  hintLvl=0;hintTarget=-1;hintCD=0;hintCluster=null;
  elapsed=0;t0=Date.now();
  if(tInt)clearInterval(tInt);
  tInt=setInterval(()=>{if(phase==='PLAYING'||phase==='CARRYING'){elapsed=Math.floor((Date.now()-t0)/1000);updHUD();}},1000);
  phase='PLAYING';
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('completeScreen').classList.add('hidden');
  document.getElementById('hud').style.display='';
  document.getElementById('hintBtn').classList.remove('hidden');
  document.getElementById('settingsPanel').classList.remove('visible');
  hideThumb();clearHL();updHUD();
  document.getElementById('hexSlider').value=curSub;
  document.getElementById('hexCount').textContent=playable;
  updInfo('Long-press any tile to collect it');
}

function pickUp(fi){
  if(phase!=='PLAYING')return;
  const f=fD[fi];
  if(f.state==='transformed'||f.isPole)return;

  if(gameMode==='hex'){
    // MOSAIC MODE: pick tile inside, then flip to outside to search
    carryF=fi; // inside position picked
    carryT=findOutsideTile(fi); // outside tile holding fi's content
    if(carryT<0)return;

    phase='CARRYING';
    snd('pickup');

    // Render preview BEFORE switching view (renders from inside)
    showThumb(carryF);

    // Amber pulse on selected tile before switching
    showHL(fi);
    document.getElementById('carryBar').classList.add('visible');
    updInfo('Find the matching tile on the globe');

    // Delay the switch so player sees which tile they picked
    setTimeout(()=>{
      clearHL();
      switchToOutside();
    },900);
  } else {
    // IMAGE MODE: original behaviour
    carryF=fi;carryT=sMap[fi];
    phase='CARRYING';
    showHL(fi);
    showThumb(carryT);
    snd('pickup');
    document.getElementById('carryBar').classList.add('visible');
    updInfo('Swipe to find where this belongs · Long-press to place');
  }
}

function tryPlace(fi){
  if(phase!=='CARRYING'||carryF<0)return;
  if(fD[fi].isPole)return;

  if(gameMode==='hex'){
    // MOSAIC MODE: player taps a tile on the outside
    if(fi===carryF){cancelC();return;} // tapping the same position = cancel

    if(fi===carryT){
      // Correct! This outside tile holds carryF's content
      snd('correct');moves++;

      // Green pulse on the matched outside tile
      greenFace=fi;greenEnd=Date.now()+600;

      // Transform the inside tile
      fD[carryF].state='transformed';done++;

      // Swap on outside: carryT gets whatever carryF had
      sMap[carryT]=sMap[carryF];
      computeScrambledUvs(carryT);
      // carryF is now transformed, mark it resolved
      sMap[carryF]=carryF;
      fD[carryF].scrambledUvs=null;

      const placedTile=carryF;

      // Clear carry state
      carryF=-1;carryT=-1;
      phase='TRANSITIONING'; // block input during animation
      document.getElementById('carryBar').classList.remove('visible');
      hideThumb();hintLvl=0;hintCluster=null;clearTimeout(hintTO);

      score+=100+Math.max(0,50-Math.floor(elapsed/playable*2));
      updHUD();

      // After green pulse on outside, switch to inside centered on placed tile
      setTimeout(()=>{
        // Center camera on the placed tile
        const c=fD[placedTile].center;
        lat=Math.asin(Math.max(-1,Math.min(1,c[1])))*180/Math.PI;
        lon=Math.atan2(c[2],-c[0])*180/Math.PI;
        mom.x=0;mom.y=0; // kill momentum

        switchToInside();

        // Green pulse on the revealed inside tile
        greenFace=placedTile;greenEnd=Date.now()+800;
        showFlash('correct');

        phase='PLAYING';

        // Auto-complete last tile
        if(done===playable-1){
          for(let i=0;i<total;i++){if(!fD[i].isPole&&fD[i].state!=='transformed'){fD[i].state='transformed';done++;break;}}
          updHUD();
        }

        if(done>=playable)setTimeout(finish,600);
        else updInfo('Correct! Long-press another tile');
      },650);
    } else {
      snd('wrong');showFlash('wrong');
      updInfo('Not quite — keep looking');
    }
  } else {
    // IMAGE MODE: original behaviour
    if(fi===carryF){cancelC();return;}

    if(fi===carryT){
      snd('correct');moves++;
      setFS(fi,'transformed');done++;
      sMap[carryF]=sMap[fi];
      clearHL();carryF=-1;carryT=-1;phase='PLAYING';
      document.getElementById('carryBar').classList.remove('visible');
      hideThumb();hintLvl=0;hintCluster=null;clearTimeout(hintTO);
      score+=100+Math.max(0,50-Math.floor(elapsed/playable*2));
      showFlash('correct');updHUD();
      if(done===playable-1){
        for(let i=0;i<total;i++){if(!fD[i].isPole&&fD[i].state!=='transformed'){setFS(i,'transformed');done++;break;}}
        updHUD();
      }
      if(done>=playable)setTimeout(finish,600);
      else updInfo('Correct! Long-press another tile');
    } else {
      snd('wrong');showFlash('wrong');
      updInfo('Not quite — keep looking');
    }
  }
}

function cancelC(){
  if(carryF>=0){carryF=-1;carryT=-1;}
  clearHL();phase='PLAYING';
  document.getElementById('carryBar').classList.remove('visible');
  hideThumb();hintLvl=0;hintTarget=-1;hintCluster=null;clearTimeout(hintTO);
  // In mosaic mode, switch back to inside on cancel
  if(gameMode==='hex'&&!viewInside)switchToInside();
  updInfo('Long-press a tile to collect it');
}

function useHint(){
  if(phase!=='CARRYING'||carryT<0)return;
  const now=Date.now();if(now<hintCD)return;
  if(hintLvl===0){
    snd('hint');hintLvl=1;hintTarget=carryT;
    hintCluster=new Set([carryT]);
    for(const ni of adj[carryT])hintCluster.add(ni);
    hintCD=now+5000;score=Math.max(0,score-15);updHUD();
    updInfo('Hint: somewhere in the glowing area');
    hintTO=setTimeout(()=>{hintCluster=null;},6000);
  } else {
    clearTimeout(hintTO);snd('hint');hintLvl=2;hintCluster=null;
    hintTarget=carryT;hintCD=now+20000;score=Math.max(0,score-50);updHUD();
    updInfo('There it is!');
    hintTO=setTimeout(()=>{hintLvl=0;hintTarget=-1;},5000);
  }
}

function finish(){
  phase='COMPLETE';if(tInt){clearInterval(tInt);tInt=null;}
  // Ensure we end on the inside view showing the completed scene
  if(gameMode==='hex'&&!viewInside)switchToInside();
  snd('done');score+=Math.max(0,1000-elapsed*2);
  document.getElementById('finalScore').textContent=score;
  const m=Math.floor(elapsed/60),s=elapsed%60;
  document.getElementById('finalStats').innerHTML=`${playable} tiles<br>Time: ${m}:${s.toString().padStart(2,'0')}<br>Moves: ${moves}`;
  document.getElementById('completeScreen').classList.remove('hidden');
  document.getElementById('carryBar').classList.remove('visible');
  document.getElementById('hintBtn').classList.add('hidden');
  hideThumb();clearHL();if(edgeGrp)edgeGrp.visible=false;
}

// ═══════════════════════════════════════════
// 12. INPUT
// ═══════════════════════════════════════════
const rc=new THREE.Raycaster(),pt=new THREE.Vector2();
let lon=0,lat=0,pDown=false,pX=0,pY=0,mom={x:0,y:0};
let lpT=null,lpS={x:0,y:0};
function gP(e){return e.touches?e.touches[0]:e;}
function onD(e){if(e.touches&&e.touches.length>1)return;ensA();const p=gP(e);pDown=true;mom.x=0;mom.y=0;pX=p.clientX;pY=p.clientY;lpS.x=p.clientX;lpS.y=p.clientY;clearTimeout(lpT);lpT=setTimeout(()=>doLP(lpS.x,lpS.y),400);}
function onM(e){if(!pDown)return;if(e.touches&&e.touches.length>1)return;e.preventDefault();const p=gP(e);const dx=p.clientX-pX,dy=p.clientY-pY;const hDir=viewInside?-1:1;lon+=hDir*dx*.25;lat+=dy*.25;lat=Math.max(-85,Math.min(85,lat));mom.x=hDir*dx*.15;mom.y=dy*.15;pX=p.clientX;pY=p.clientY;const mx=p.clientX-lpS.x,my=p.clientY-lpS.y;if(mx*mx+my*my>100){clearTimeout(lpT);lpT=null;}}
function onU(){pDown=false;clearTimeout(lpT);lpT=null;}
function doLP(sx,sy){pt.x=(sx/window.innerWidth)*2-1;pt.y=-(sy/window.innerHeight)*2+1;rc.setFromCamera(pt,camera);const h=rc.intersectObjects(fMeshes);if(!h.length)return;const fi=h[0].object.userData.fi;if(phase==='PLAYING')pickUp(fi);else if(phase==='CARRYING')tryPlace(fi);}
const el=renderer.domElement;
el.addEventListener('mousedown',onD);el.addEventListener('mousemove',onM);el.addEventListener('mouseup',onU);el.addEventListener('mouseleave',onU);
el.addEventListener('touchstart',onD,{passive:false});el.addEventListener('touchmove',onM,{passive:false});el.addEventListener('touchend',onU);
let lpd=0;
el.addEventListener('touchstart',e=>{if(e.touches.length===2){pDown=false;clearTimeout(lpT);const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;lpd=Math.sqrt(dx*dx+dy*dy);}},{passive:false});
el.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;const d=Math.sqrt(dx*dx+dy*dy);camera.fov=Math.max(30,Math.min(100,camera.fov-(d-lpd)*.15));camera.updateProjectionMatrix();lpd=d;}},{passive:false});
el.addEventListener('wheel',e=>{e.preventDefault();camera.fov=Math.max(30,Math.min(100,camera.fov+e.deltaY*.05));camera.updateProjectionMatrix();},{passive:false});

// ═══════════════════════════════════════════
// 13. UI
// ═══════════════════════════════════════════
function updHUD(){document.getElementById('scoreDisplay').textContent=score;const m=Math.floor(elapsed/60),s=elapsed%60;document.getElementById('timerDisplay').textContent=m+':'+s.toString().padStart(2,'0');document.getElementById('progressBar').style.width=(playable>0?Math.round(done/playable*100):0)+'%';}
function updInfo(m){document.getElementById('infoBar').textContent=m;}
function showFlash(t){const e=document.getElementById(t==='correct'?'flashCorrect':'flashWrong');e.classList.add('show');setTimeout(()=>e.classList.remove('show'),300);}

document.getElementById('hintBtn').addEventListener('click',e=>{e.stopPropagation();useHint();});
document.getElementById('hintBtn').addEventListener('touchend',e=>{e.stopPropagation();e.preventDefault();useHint();});
document.getElementById('cancelBtn').addEventListener('click',e=>{e.stopPropagation();cancelC();});
document.getElementById('cancelBtn').addEventListener('touchend',e=>{e.stopPropagation();e.preventDefault();cancelC();});
document.getElementById('startBtn').addEventListener('click',()=>{ensA();startGame();});
document.getElementById('replayBtn').addEventListener('click',()=>{startGame();});
// Settings panel toggle
document.getElementById('settingsBtn').addEventListener('click',e=>{
  e.stopPropagation();
  document.getElementById('settingsPanel').classList.toggle('visible');
});
// Close settings when tapping outside
renderer.domElement.addEventListener('mousedown',()=>{document.getElementById('settingsPanel').classList.remove('visible');});
renderer.domElement.addEventListener('touchstart',()=>{document.getElementById('settingsPanel').classList.remove('visible');},{passive:true});

document.getElementById('edgeBtn').addEventListener('click',()=>{edges=!edges;if(edgeGrp)edgeGrp.visible=edges;document.getElementById('edgeBtn').classList.toggle('active',edges);});
document.getElementById('modeBtn').addEventListener('click',()=>{easy=!easy;document.getElementById('modeBtn').textContent=easy?'Easy':'Hard';document.getElementById('modeBtn').classList.toggle('active',easy);if(!easy)hideThumb();else if(carryF>=0){if(gameMode==='hex')showThumb(carryF);else if(carryT>=0)showThumb(carryT);}});

// Inside/Outside toggle
function applyViewMode(){
  if(viewInside)switchToInside();else switchToOutside();
}
document.getElementById('viewBtn').addEventListener('click',()=>{
  if(viewInside)switchToOutside();else switchToInside();
});
let sTO=null;
document.getElementById('hexSlider').addEventListener('input',e=>{const v=parseInt(e.target.value);document.getElementById('hexCount').textContent=((TC[v]||42)-2);clearTimeout(sTO);sTO=setTimeout(()=>{curSub=v;startGame();},400);});
document.getElementById('mosaicSlider').addEventListener('input',e=>{mosaicDensity=parseInt(e.target.value);document.getElementById('mosaicVal').textContent=mosaicDensity;clearTimeout(sTO);sTO=setTimeout(()=>{startGame();},400);});
document.getElementById('uploadBadBtn').addEventListener('click',()=>document.getElementById('fileBad').click());
document.getElementById('uploadGoodBtn').addEventListener('click',()=>document.getElementById('fileGood').click());
function ldTex(file,cb){const r=new FileReader();r.onload=ev=>{const img=new Image();img.onload=()=>{const t=new THREE.Texture(img);t.wrapS=THREE.RepeatWrapping;t.wrapT=THREE.ClampToEdgeWrapping;t.needsUpdate=true;cb(t);};img.src=ev.target.result;};r.readAsDataURL(file);}
document.getElementById('fileBad').addEventListener('change',e=>{if(!e.target.files[0])return;ldTex(e.target.files[0],t=>{if(badTex)badTex.dispose();badTex=t;startGame();});});
document.getElementById('fileGood').addEventListener('change',e=>{if(!e.target.files[0])return;ldTex(e.target.files[0],t=>{if(goodTex)goodTex.dispose();goodTex=t;startGame();});});

// ═══════════════════════════════════════════
// 14. RENDER
// ═══════════════════════════════════════════
const clk=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);const time=clk.getElapsedTime();
  if(!pDown){lon+=mom.x;lat+=mom.y;lat=Math.max(-85,Math.min(85,lat));mom.x*=.93;mom.y*=.93;if(Math.abs(mom.x)<.001)mom.x=0;if(Math.abs(mom.y)<.001)mom.y=0;}
  const phi=THREE.MathUtils.degToRad(90-lat),theta=THREE.MathUtils.degToRad(lon);
  if(viewInside){
    // Inside: camera at center, looking outward
    camera.position.set(0,0,0);
    camera.lookAt(500*Math.sin(phi)*Math.cos(theta),500*Math.cos(phi),500*Math.sin(phi)*Math.sin(theta));
  } else {
    // Outside: camera orbits the sphere, looking inward at center
    const dist=780;
    camera.position.set(
      dist*Math.sin(phi)*Math.cos(theta),
      dist*Math.cos(phi),
      dist*Math.sin(phi)*Math.sin(theta)
    );
    camera.lookAt(0,0,0);
  }

  if(phase==='PLAYING'||phase==='CARRYING'||phase==='TRANSITIONING'){
    const now=Date.now();
    for(let i=0;i<fD.length;i++){
      const f=fD[i];if(f.isPole)continue;
      if(i===greenFace&&now<greenEnd){
        // Green pulse on correctly placed tile
        const p=.6+.4*Math.sin(time*6);
        f.mesh.material.color.setRGB(p*.3,1,p*.3);
      } else if(i===hlFace){
        // Pulsing orange tint on selected source tile
        const p=.6+.4*Math.sin(time*3);
        f.mesh.material.color.setRGB(1,p*.4+.1,0);
      } else if(hintLvl===2&&i===hintTarget&&f.state!=='transformed'){
        const h=.5+.5*Math.sin(time*6);f.mesh.material.color.setRGB(1,h*.4+.6,h*.2);
      } else if(hintLvl===1&&hintCluster&&hintCluster.has(i)&&f.state!=='transformed'){
        const h=.7+.3*Math.sin(time*4);f.mesh.material.color.setRGB(h,h*.9,h*.6);
      } else if(f.state!=='transformed'){
        f.mesh.material.color.setRGB(1,1,1);
      } else {
        f.mesh.material.color.setRGB(1,1,1);
      }
    }
    if(now>=greenEnd)greenFace=-1;
    const hb=document.getElementById('hintBtn');
    if(now<hintCD){hb.classList.add('cooldown');hb.textContent=Math.ceil((hintCD-now)/1000);}
    else{hb.classList.remove('cooldown');hb.textContent='?';}
  }
  renderer.render(scene,camera);
}
animate();
window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});

// Load embedded images, then build sphere
let imgLoaded=0;
function onImgReady(){imgLoaded++;if(imgLoaded>=2)build();}
loadEmbeddedTex(BAD_IMG_SRC,t=>{badTex=t;onImgReady();});
loadEmbeddedTex(GOOD_IMG_SRC,t=>{goodTex=t;onImgReady();});
setTimeout(()=>{if(imgLoaded<2){if(!badTex)badTex=mkBadFallback();if(!goodTex)goodTex=mkGoodFallback();build();}},2000);
</script>
